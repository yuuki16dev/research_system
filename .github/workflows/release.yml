name: Release Build & Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'ビルド対象のバージョンタグ（例: v1.1.5）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Executable & Create Release
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Determine Release Tag
        id: release_info
        run: |
          if ("${{ github.event.inputs.tag_name }}" -ne "") {
            $tag = "${{ github.event.inputs.tag_name }}"
          } elseif ("${{ github.ref }}" -like "refs/tags/*") {
            $tag = "${{ github.ref_name }}"
          } else {
            $pkg = Get-Content package.json | ConvertFrom-Json
            $tag = "v$($pkg.version)"
          }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Target Release Tag: $tag"

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build Windows Executable (.exe)
        run: |
          New-Item -ItemType Directory -Force -Path dist
          npm run build:exe

      - name: Compress into ZIP
        run: |
          Compress-Archive -Path dist/ResearchStudio.exe -DestinationPath dist/ResearchStudio-win.zip -Force

      - name: Create or Update GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Research Studio ${{ steps.release_info.outputs.tag }} (Windows ワンクリック版)
          draft: false
          prerelease: false
          make_latest: 'true'
          generate_release_notes: true
          files: |
            dist/ResearchStudio-win.zip
            dist/ResearchStudio.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
