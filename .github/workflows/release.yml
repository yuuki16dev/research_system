name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'ビルド対象のバージョンタグ（例: v1.1.5）'
        required: true
        default: 'v1.1.5'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Executable & Create Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build Windows Executable (.exe)
        run: |
          New-Item -ItemType Directory -Force -Path dist
          npm run build:exe
        shell: powershell

      - name: Compress into ZIP
        run: |
          Compress-Archive -Path dist/ResearchStudio.exe -DestinationPath dist/ResearchStudio-win.zip -Force
        shell: powershell

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Research Studio ${{ github.event.inputs.tag_name || github.ref_name }} (Windows ワンクリック版)
          draft: false
          prerelease: false
          make_latest: 'true'
          generate_release_notes: true
          files: |
            dist/ResearchStudio-win.zip
            dist/ResearchStudio.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
