# ======================================================================
# Render Blueprint Specification
# Docs: https://render.com/docs/blueprint-spec
# ======================================================================

services:
  - type: web
    name: research-studio
    env: docker
    plan: starter # $7/month (常時稼働・スリープなし)
    region: oregon # or tokyo if available
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: PORT
        value: 3939
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false # Renderダッシュボードの環境変数画面で入力
      - key: TAVILY_API_KEY
        sync: false # Renderダッシュボードの環境変数画面で入力
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false # Supabase プロジェクトURL (https://xxxx.supabase.co)
      - key: SUPABASE_ANON_KEY
        sync: false # Supabase anon public APIキー
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Supabase service_role キー（クォータ更新・RLSバイパス用）
      - key: ADMIN_USER_IDS
        sync: false # 管理者UUIDリスト（カンマ区切り・B-1）
      - key: HISTORY_MAX_PER_USER
        value: 100
      - key: HISTORY_RETENTION_DAYS
        value: 0
      - key: ENABLE_TEST_USERS
        value: "false" # 本番安全デフォルト（検証時のみ Render 管理画面で "true" に変更）
      - key: ALLOW_ANONYMOUS_CLOUD
        sync: false # テスト公開時のみ "true" を設定（既定は未設定＝ログイン必須）
      - key: DAILY_COST_LIMIT_JPY
        value: 1000 # 全体の日次AI推定原価上限 (JPY・R-5)
      - key: FREE_DAILY_COST_LIMIT_JPY
        value: 300 # 無料枠専用の日次原価上限 (JPY・S-3)
      - key: TURNSTILE_SITE_KEY
        sync: false # Cloudflare Turnstile サイトキー (Bot新規登録防止・S-3)
      - key: TURNSTILE_SECRET_KEY
        sync: false # Cloudflare Turnstile シークレットキー (S-3)
      - key: MODEL_PRICING_JSON
        sync: false # AI Studio 請求画面で確認したモデル単価JSON (R-6)
      - key: TAVILY_USD_PER_CREDIT
        value: "0.008" # Tavily 1クレジット単価 (USD・仮値・R-6)
      - key: USD_JPY_RATE
        value: 150 # 為替レート (JPY/USD・仮値・R-6)
      - key: GEMINI_FALLBACK_MODELS
        sync: false # クラウド版の切り替え先モデル（未設定時は切り替えなし・R-6）
      - key: TRUST_PROXY_HOPS
        value: 1 # 信頼するリバースプロキシのホップ数（既定: 1・R-9）

