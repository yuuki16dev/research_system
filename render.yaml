# ======================================================================
# Render Blueprint Specification
# Docs: https://render.com/docs/blueprint-spec
# ======================================================================

services:
  - type: web
    name: research-studio
    env: docker
    plan: starter # $7/month (常時稼働・スリープなし)
    region: oregon # or tokyo if available
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 3939
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false # Renderダッシュボードの環境変数画面で入力
      - key: TAVILY_API_KEY
        sync: false # Renderダッシュボードの環境変数画面で入力
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false # Supabase プロジェクトURL (https://xxxx.supabase.co)
      - key: SUPABASE_ANON_KEY
        sync: false # Supabase anon public APIキー
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Supabase service_role キー（クォータ更新・RLSバイパス用）
      - key: ADMIN_USER_IDS
        sync: false # 管理者UUIDリスト（カンマ区切り・B-1）
      - key: HISTORY_MAX_PER_USER
        value: 100
      - key: HISTORY_RETENTION_DAYS
        value: 0
      - key: ENABLE_TEST_USERS
        value: "true" # 検証用テストアカウントを配置・有効化

